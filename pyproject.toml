[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-healthcare-llm"
version = "0.1.0"
description = "Research-grade fine-tuning and evaluation for Maya, a sovereign healthcare operations LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Maya Research" }]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "requests>=2.31",
    "datasets>=3.0",
    "transformers>=5.0",
    "accelerate>=0.30",
    "peft>=0.12",
    "trl>=0.12",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
train = [
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
    "unsloth_zoo",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
maya = "maya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
