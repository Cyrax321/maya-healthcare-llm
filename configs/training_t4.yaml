# Conservative single-T4 training recipe.
#
# These are STARTING points, not universal optima. A small controlled sweep
# (train.py --sweep) selects LoRA rank, learning rate, batch size and epochs
# using the VALIDATION split only. The final test set is never used for tuning
# or checkpoint selection.

precision:
  # T4 hard constraint (discovered at the smoke train):
  #   - Tesla T4 (Turing) has NO bf16 support (Unsloth banner: "Bfloat16 = FALSE").
  #   - Unsloth rejects fp16 for qwen3_5 (the Gated-DeltaNet linear-attention
  #     SSM state is float32), so it falls back to float32 training.
  #   - float32 base weights ~= 18GB > 16GB T4 -> CUDA OOM.
  #   - Therefore QLoRA (4-bit base weights ~2.5GB) is the ONLY fit on a T4.
  #     Unsloth warns QLoRA on Qwen3.5 has larger quantization differences.
  #   - bf16 LoRA (10GB, the original first choice) works on bf16-capable GPUs
  #     (A100/L4/L40), NOT on the T4.
  preferred: "q4_qlora"
  fallback: "fp16_lora"        # bf16 LoRA on a bf16-capable GPU (A100/L4/L40)
  full_finetune: false          # never full-parameter fine-tune on a T4

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  use_rslora: false
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  max_seq_length: 2048         # start conservative; profile before scaling up
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: "unsloth"
  max_steps: 300               # smoke-test scale; raise for a real run
  warmup_steps: 20
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  gradient_clipping: 1.0
  optim: "adamw_8bit"
  logging_steps: 1
  save_steps: 50
  eval_steps: 50
  eval_strategy: "steps"
  metric_for_best_model: "eval_loss"
  load_best_model_at_end: true
  seed: 3407
  dataset_num_proc: 1
  fp16: true                    # T4 has no native bf16 acceleration; fp16 faster
  bf16: false
  report_to: "none"             # no wandb on Colab by default

sweep:
  # Small controlled experiment used to choose hyperparameters (Section 5).
  lora_r: [8, 16, 32]
  learning_rate: [1.0e-4, 2.0e-4, 5.0e-4]
  max_steps: 100
  # Grid is capped so the whole sweep finishes in one T4 session.
  max_combinations: 6

checkpointing:
  resume: true                  # save/restore Trainer state to survive disconnects
  output_dir: "artifacts/{experiment_id}/checkpoints"
  save_adapter: true
  push_to_hub: false

hub:
  # Token comes from the HF_TOKEN env var only (Colab Secret). Never hard-code it.
  token_env: "HF_TOKEN"
  repo_id: "Maya-Q1"            # full id on push: <your-user>/Maya-Q1
  results_repo_id: "Maya-Q1-results"
  private: true
